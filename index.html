<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free HTML5 Ludo Game</title>
    <style>
        :root {
            --red: #ff4d4d;
            --green: #2ecc71;
            --yellow: #f1c40f;
            --blue: #3498db;
            --border: #333;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f6fa;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        h1 {
            color: #2c3e50;
            margin-bottom: 10px;
        }
        .game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }
        /* Ludo Board CSS Grid Layout */
        .board {
            width: 450px;
            height: 450px;
            background-color: #fff;
            border: 4px solid var(--border);
            display: grid;
            grid-template-columns: repeat(15, 1fr);
            grid-template-rows: repeat(15, 1fr);
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
        .cell {
            border: 1px solid #ccc;
            box-sizing: border-box;
        }
        /* Home Yards */
        .red-home { grid-column: 1 / 7; grid-row: 1 / 7; background-color: var(--red); position: relative; }
        .green-home { grid-column: 10 / 16; grid-row: 1 / 7; background-color: var(--green); position: relative; }
        .yellow-home { grid-column: 10 / 16; grid-row: 10 / 16; background-color: var(--yellow); position: relative; }
        .blue-home { grid-column: 1 / 7; grid-row: 10 / 16; background-color: var(--blue); position: relative; }
        
        /* White inner pockets for tokens */
        .yard-inner {
            position: absolute;
            top: 15%; left: 15%; width: 70%; height: 70%;
            background-color: #fff;
            border-radius: 10px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            padding: 10px;
            box-sizing: border-box;
            gap: 10px;
        }
        .token-slot {
            border-radius: 50%;
            border: 2px dashed #999;
        }
        .red-slot { background-color: var(--red); }
        .green-slot { background-color: var(--green); }
        .yellow-slot { background-color: var(--yellow); }
        .blue-slot { background-color: var(--blue); }

        /* Center Triangle */
        .center-home {
            grid-column: 7 / 10;
            grid-row: 7 / 10;
            background: conic-gradient(
                var(--red) 45deg, 
                var(--green) 45deg 135deg, 
                var(--yellow) 135deg 225deg, 
                var(--blue) 225deg 315deg, 
                var(--red) 315deg
            );
            border: 1px solid var(--border);
        }

        /* Track Colors */
        .bg-red { background-color: var(--red); }
        .bg-green { background-color: var(--green); }
        .bg-yellow { background-color: var(--yellow); }
        .bg-blue { background-color: var(--blue); }
        .star-cell { background-color: #dcdde1; position: relative; }
        .star-cell::after { content: '★'; position: absolute; top:50%; left:50%; transform:translate(-50%, -50%); color: #7f8c8d; font-size: 14px;}

        /* Controls */
        .controls {
            display: flex;
            align-items: center;
            gap: 20px;
            background: white;
            padding: 15px 30px;
            border-radius: 50px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        .turn-indicator {
            font-size: 18px;
            font-weight: bold;
            color: #333;
        }
        .dice {
            width: 50px;
            height: 50px;
            background-color: white;
            border: 3px solid var(--border);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.1s ease;
            user-select: none;
        }
        .dice:active {
            transform: scale(0.9);
        }
    </style>
</head>
<body>

            <div class="cell star-cell"></div><div class="cell bg-red"></div><div class="cell bg-red"></div><div class="cell bg-red"></div><div class="cell bg-red"></div><div class="cell bg-red"></div>

            <div class="cell"></div><div class="cell"></div><div class="cell bg-yellow"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>

            <!-- Blue Home -->
            <div class="blue-home">
                <div class="yard-inner">
                    <div class="token-slot blue-slot"></div>

            <!-- Yellow Home -->

                    <div class="token-slot yellow-slot"></div>

                    <div class="token-slot yellow-slot"></div>
                    <div class="token-slot yellow-slot"></div>
                </div>
            </div>
        </div>

        <!-- Interactive Dice Controls -->
        <div class="controls">
            <div class="turn-indicator" id="turnIndicator">Turn: <span style="color:var(--red)">Red</span></div>
            <div class="dice" id="ludoDice" onclick="rollDice()">⚀</div>
        </div>
    </div>
